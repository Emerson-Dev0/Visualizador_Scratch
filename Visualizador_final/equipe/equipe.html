<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipe SKA Tech Hub</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at 60% 20%, #5a1c99 0%, #3a0f66 40%, #260947 100%);
      color: #f8eaff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      width: 100%;
    }

    .btn-voltar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      padding: 16px 30px;
      border-radius: 14px;
      border: 3px solid #fff8c4;
      color: #4e2a00;
      background: linear-gradient(90deg, #fff176, #ffca28, #ff9800);
      text-decoration: none;
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 0;
      box-shadow: 0 8px 22px rgba(255, 193, 7, 0.55);
      transition: 0.2s ease;
    }

    .btn-voltar:hover {
      filter: brightness(1.08);
      transform: scale(1.03);
    }

    .hero {
      border: 2px solid rgba(255, 193, 7, 0.48);
      background: linear-gradient(180deg, rgba(255, 244, 191, 0.18), rgba(255, 193, 7, 0.14));
      padding: 26px;
      margin-bottom: 26px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      border-radius: 20px;
    }

    .hero h1 {
      color: #ffe082;
      font-size: clamp(2rem, 5vw, 4.2rem);
      line-height: 1;
      letter-spacing: 0;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .hero p {
      max-width: 720px;
      margin: 0 auto;
      color: #ffecb3;
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .equipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 22px;
    }

    .membro-card {
      background: linear-gradient(180deg, rgba(255, 193, 7, 0.14), rgba(255, 179, 0, 0.16));
      border: 2px solid rgba(255, 193, 7, 0.4);
      padding: 12px 12px 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      border-radius: 18px;
      transition: 0.25s ease;
    }

    .membro-card:hover {
      transform: translateY(-4px);
      border-color: #ffca28;
      box-shadow: 0 10px 30px rgba(255, 193, 7, 0.45);
    }

    .foto-moldura {
      width: 100%;
      aspect-ratio: 4 / 5;
      border: 2px solid rgba(255, 193, 7, 0.35);
      background: #2b1145;
      margin-bottom: 12px;
      overflow: hidden;
      border-radius: 12px;
    }

    .foto-moldura img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .membro-nome {
      font-family: Georgia, "Times New Roman", serif;
      color: #ffe082;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 6px;
      text-align: center;
    }

    .membro-cargo {
      width: fit-content;
      max-width: 100%;
      margin: 0 auto 10px;
      border: 1px solid rgba(255, 202, 40, 0.35);
      background: rgba(255, 202, 40, 0.14);
      color: #fff3cd;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
    }

    .membro-descricao {
      color: #ffecb3;
      font-size: 0.92rem;
      line-height: 1.45;
      text-align: center;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #ffecb3;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero {
        padding: 20px;
      }

      .equipe-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="topbar">
      <a class="btn-voltar" href="../paginaPrincipal.html">Voltar para a home</a>
    </div>

    <section class="hero">
      <h1>Equipe SKA Tech Hub</h1>
      <p>Registro da equipe que acompanha, organiza e apoia a Jornada Tecnológica SKA.</p>
    </section>

    <section id="equipeGrid" class="equipe-grid"></section>

    <div class="footer">
      Galeria dos Alunos - SKA Tech Hub
    </div>
  </main>

  <script src="equipe.js"></script>
  <script>
    function criarElemento(tag, className, textContent) {
      const element = document.createElement(tag);
      if (className) {
        element.className = className;
      }
      if (textContent) {
        element.textContent = textContent;
      }
      return element;
    }

    function criarFoto(membro) {
      const moldura = criarElemento("div", "foto-moldura");

      if (!membro.foto || membro.foto.trim() === "") {
        return moldura;
      }

      const img = document.createElement("img");
      img.src = membro.foto;
      img.alt = "Foto de " + membro.nome;
      img.onerror = function () {
        this.remove();
      };

      moldura.appendChild(img);
      return moldura;
    }

    function renderizarEquipe() {
      const grid = document.getElementById("equipeGrid");
      const equipe = window.EQUIPE_DATA || [];

      equipe.forEach((membro) => {
        const card = criarElemento("article", "membro-card");

        card.appendChild(criarFoto(membro));
        card.appendChild(criarElemento("h2", "membro-nome", membro.nome));
        card.appendChild(criarElemento("div", "membro-cargo", membro.cargo));
        card.appendChild(
          criarElemento("p", "membro-descricao", membro.descricao)
        );

        grid.appendChild(card);
      });
    }

    renderizarEquipe();
  </script>
</body>
</html>
